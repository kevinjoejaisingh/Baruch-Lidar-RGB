# Fusion Pipeline Configuration
# LiDAR (Livox Mid-360) + D455 (Intel RealSense) → Colored 3D Point Cloud

lidar:
  ip: "192.168.1.171"
  host_ip: "192.168.1.50"
  interface: "enx6c1ff76add18"
  slam_config: "~/ws_livox/config/rko_lio_mid360.yaml"
  bag_topics:
    - /livox/lidar
    - /livox/imu
    - /rko_lio/local_map
    - /rko_lio/odometry
    - /rko_lio/frame
  ros_setup: "source /opt/ros/jazzy/setup.bash && source ~/ws_livox/install/setup.bash"

d455:
  width: 1280
  height: 720
  fps: 30
  accel_fps: 200
  gyro_fps: 200
  max_depth_m: 3.0

capture:
  auto_capture_hz: 2
  warmup_frames: 30
  driver_startup_wait_s: 5
  slam_startup_wait_s: 3

processing:
  # LiDAR export
  lidar_voxel_size: 0.01
  lidar_outlier_neighbors: 50
  lidar_outlier_std: 1.5
  # D455 ICP
  d455_voxel_size: 0.02
  icp_max_distance: 0.05
  icp_max_iterations: 50
  normal_radius: 0.1
  normal_max_nn: 30
  # Loop closure
  loop_closure_max_distance: 0.10
  loop_closure_max_iterations: 100
  # Pose graph
  pose_graph_method: "trf"
  pose_graph_max_iterations: 100
  pose_graph_tolerance: 1.0e-6

alignment:
  max_timestamp_diff_ms: 100
  ransac_threshold: 0.05
  ransac_max_iterations: 1000
  ransac_min_inliers: 10

projection:
  zbuffer_tolerance: 0.05
  max_distance_m: 10.0
  default_color: [128, 128, 128]
  depth_consistency_threshold: 0.10

paths:
  scan_dir: "~/fusion_pipeline/scans"
  threed_room_src: "~/3dRoom/src"
